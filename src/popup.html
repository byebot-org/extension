<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header><img src="../icons/icon-32.png" alt="" /><h1>ByeBot</h1></header>

  <section>
    <p id="auth-text"></p>
    <button id="signin" class="primary" data-i18n="signIn"></button>
    <button id="signout" data-i18n="signOut" hidden></button>
  </section>

  <section>
    <label for="mode" data-i18n="flaggedChannels"></label>
    <select id="mode">
      <option value="hide" data-i18n="modeHide"></option>
      <option value="mark" data-i18n="modeMark"></option>
      <option value="off" data-i18n="modeOff"></option>
    </select>
  </section>

  <section>
    <label for="shortsMode" data-i18n="shortsLabel"></label>
    <select id="shortsMode">
      <option value="skip" data-i18n="shortsSkip"></option>
      <option value="mark" data-i18n="shortsMark"></option>
      <option value="off" data-i18n="shortsOff"></option>
    </select>
  </section>

  <section id="danger" hidden>
    <button id="delete" class="link" data-i18n="deleteAccount"></button>
  </section>

  <footer><a href="https://byebot.org/privacy" target="_blank" rel="noopener" data-i18n="privacy"></a> · <a href="https://byebot.org" target="_blank" rel="noopener">byebot.org</a></footer>
  <script src="i18n.js"></script>
  <script src="popup.js"></script>
</body>
</html>
